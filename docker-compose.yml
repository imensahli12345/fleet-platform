services:
  postgres:
    image: postgres:15
    container_name: fleet-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fleet_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:6
    container_name: fleet-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  #kafka:
    #image: bitnami/kafka:3.4
